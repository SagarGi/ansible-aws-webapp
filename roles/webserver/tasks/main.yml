---
- name: Install Node Js and Npm
  ansible.builtin.apt:
    name: [nodejs, npm]
    state: present

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ webserver_app_dir }}"
    state: directory
    mode: "0755"
    owner: ubuntu
    group: ubuntu

- name: Copy the Node application files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ webserver_app_dir }}/{{ item }}"
    mode: "0644"
    owner: ubuntu
    group: ubuntu
  loop:
    - app.js
    - package.json
  notify: Restart node app

- name: Install app dependencies
  community.general.npm:
    path: "{{ webserver_app_dir }}"

- name: Install the systemd service for the app
  ansible.builtin.template:
    src: nodeapp.service.j2
    dest: /etc/systemd/system/nodeapp.service
    mode: "0644"
  notify: Restart node app

- name: Enable and start the Node app
  ansible.builtin.systemd:
    name: nodeapp
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy the app environment file with DB connection
  ansible.builtin.template:
    src: nodeapp.env.j2
    dest: /etc/nodeapp.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart node app
